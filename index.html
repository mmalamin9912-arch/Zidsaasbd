<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zid SaaS BD - Multi-Vendor Marketplace</title>
    <meta name="application-name" content="Zid SaaS BD" />
    <meta name="author" content="Zid SaaS BD" />
    <meta
      name="description"
      content="Zid SaaS BD is Bangladesh's multi-vendor marketplace and e-commerce SaaS. Shop verified sellers across all 64 districts with fast delivery, bKash/Nagad payments and cash on delivery, or launch your own online store in minutes."
    />
    <meta
      name="keywords"
      content="Zid SaaS BD, Bangladesh marketplace, multi-vendor marketplace Bangladesh, online shopping BD, bKash payment, Nagad payment, cash on delivery Bangladesh, e-commerce Bangladesh"
    />
    <!--
      DISAMBIGUATION FROM SAUDI ARABIA'S "ZID" (zid.sa).

      Our brand name collides with an unrelated Saudi platform, which is why
      Search can fold us into that entity's AI Overview. These tags state the
      country, language and audience explicitly, and the JSON-LD below declares
      an `Organization` with our own `sameAs` + `areaServed` so the crawler has
      a distinct entity to attach the site name to instead of merging the two.
      Keep every fact here consistent with the schema and the page content —
      contradicting signals are what make engines fall back to a generic label.
    -->
    <meta name="geo.region" content="BD" />
    <meta name="geo.placename" content="Dhaka, Bangladesh" />
    <meta name="language" content="en" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!--
      Brand metadata for Google Search.

      Google decides the site name (and the favicon shown next to a result) from
      crawlable markup in the static <head>, not from the client-rendered React
      bundle. `og:site_name` + the WebSite JSON-LD are the signals it reads for
      the brand name — without them the domain can be labelled with the host
      (e.g. "Vercel"). Icon tags below must point at raster files: Google does
      not use SVG favicons.

      ORDER MATTERS: the first rel="icon" tag is the primary favicon browsers
      and Google prefer. It is the brand mark PNG (/favicon-48.png, rendered
      from /logo.png) so a tab shows our logo — NOT the SVG and not /favicon.ico,
      which are fallbacks only. `id="app-favicon"` is the single element the app
      mutates at runtime (dashboard branding, or a merchant's storefront icon);
      it stays on a raster icon and is restored on the way out — see
      src/lib/brandIdentity.ts.
    -->
    <link id="app-favicon" rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" data-brand-src="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#1E40AF" />
    <meta name="msapplication-TileImage" content="/logo.png" />
    <meta name="msapplication-TileColor" content="#1E40AF" />

    <meta property="og:site_name" content="Zid SaaS BD" />
    <meta property="og:title" content="Zid SaaS BD - Multi-Vendor Marketplace" />
    <meta
      property="og:description"
      content="Zid SaaS BD is Bangladesh's multi-vendor marketplace and e-commerce SaaS. Shop verified sellers across all 64 districts with fast delivery, bKash/Nagad payments and cash on delivery, or launch your own online store in minutes."
    />
    <meta property="og:url" content="https://zidbdsaas.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://zidbdsaas.vercel.app/logo.png" />
    <meta property="og:image:alt" content="Zid SaaS BD - Multi-Vendor Marketplace logo" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_BD" />
    <meta property="og:locale:alternate" content="bn_BD" />
    <meta property="article:publisher" content="https://github.com/mmalamin9912-arch/Zidsaasbd" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zid SaaS BD - Multi-Vendor Marketplace" />
    <meta
      name="twitter:description"
      content="Zid SaaS BD is Bangladesh's multi-vendor marketplace and e-commerce SaaS. Shop verified sellers across all 64 districts with fast delivery, bKash/Nagad payments and cash on delivery, or launch your own online store in minutes."
    />
    <meta name="twitter:image" content="https://zidbdsaas.vercel.app/logo.png" />
    <meta name="twitter:image:alt" content="Zid SaaS BD - Multi-Vendor Marketplace logo" />
    <link rel="canonical" href="https://zidbdsaas.vercel.app/" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://zidbdsaas.vercel.app/#website",
        "name": "Zid SaaS BD",
        "alternateName": ["Zid SaaS BD", "Zid BD", "Zid SaaS Bangladesh"],
        "url": "https://zidbdsaas.vercel.app/",
        "description": "Zid SaaS BD is Bangladesh's multi-vendor marketplace and e-commerce SaaS, connecting buyers with verified sellers across all 64 districts.",
        "inLanguage": ["en", "bn"],
        "publisher": { "@id": "https://zidbdsaas.vercel.app/#organization" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://zidbdsaas.vercel.app/#organization",
        "name": "Zid SaaS BD",
        "legalName": "Zid SaaS BD",
        "alternateName": ["Zid SaaS BD", "Zid BD"],
        "url": "https://zidbdsaas.vercel.app/",
        "description": "Zid SaaS BD is Bangladesh's multi-vendor marketplace and e-commerce SaaS, connecting buyers with verified sellers across all 64 districts. Fast delivery, bKash/Nagad payments, cash on delivery.",
        "logo": "https://zidbdsaas.vercel.app/logo.png",
        "image": "https://zidbdsaas.vercel.app/logo.png",
        "foundingLocation": {
          "@type": "Place",
          "name": "Dhaka, Bangladesh"
        },
        "nationality": {
          "@type": "Country",
          "name": "Bangladesh"
        },
        "sameAs": ["https://github.com/mmalamin9912-arch/Zidsaasbd"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dhaka",
          "addressCountry": "BD"
        },
        "areaServed": { "@type": "Country", "name": "Bangladesh" },
        "knowsLanguage": ["en", "bn"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "telephone": "+8801844990011",
          "areaServed": "BD",
          "availableLanguage": ["en", "bn"]
        }
      }
    </script>
    <!-- Google Search Console / Merchant Center site ownership verification.
         Must stay in the static <head>: Google's crawler reads the raw HTML and
         never executes the React bundle, so a tag injected at runtime would not
         be seen. -->
    <meta name="google-site-verification" content="_3GUXjJBEeN8CRNT24ED0yvQ0vwI1pt7mqk0ur9mdiI" />
    <!--
      Marketplace language bootstrap.

      `lang="en"` is the default for a fresh visitor; a returning Bangla shopper
      had to wait for React before the page was announced and hyphenated in the
      right language.

      IMPORTANT: this runs at PARSE time, before the browser has applied the
      element's own `lang="en"` attribute from the markup — so it with a module
      takes effect. It registers a one-shot `DOMContentLoaded` hook instead,
      which fires after the document (and the attribute) is complete but before
      the app's first paint. This script must also stay AFTER the markup above.
    -->
    <script>
      (function () {
        function applyLang() {
          try {
            var l = localStorage.getItem('zid_marketplace_lang') ||
                    localStorage.getItem('zid_language');
            if (l === 'bn' || l === 'en') {
              document.documentElement.setAttribute('lang', l);
            }
          } catch (e) { /* storage unavailable — keep the markup default */ }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', applyLang, { once: true });
        } else {
          applyLang();
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0f172a] text-slate-100 overflow-x-hidden antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
