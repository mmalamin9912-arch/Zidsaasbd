<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Bangladesh e-commerce dashboard banner">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223B"/><stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="gold7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4A3"/><stop offset="0.5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B77912"/>
    </linearGradient>
    <linearGradient id="bar7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#B77912"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg7)"/>
  <!-- window chrome -->
  <rect x="60" y="70" width="480" height="250" rx="16" fill="#0F1626" stroke="url(#gold7)" stroke-width="4"/>
  <rect x="60" y="70" width="480" height="36" rx="16" fill="#1B2436"/>
  <circle cx="84" cy="88" r="6" fill="#EF4444"/><circle cx="104" cy="88" r="6" fill="#F59E0B"/><circle cx="124" cy="88" r="6" fill="#22C55E"/>
  <!-- sidebar -->
  <rect x="60" y="106" width="70" height="214" fill="#141C2C"/>
  <rect x="72" y="126" width="46" height="8" rx="4" fill="url(#gold7)"/>
  <rect x="72" y="150" width="46" height="8" rx="4" fill="#334155"/>
  <rect x="72" y="174" width="46" height="8" rx="4" fill="#334155"/>
  <rect x="72" y="198" width="46" height="8" rx="4" fill="#334155"/>
  <!-- stat cards -->
  <rect x="148" y="126" width="120" height="56" rx="10" fill="#1B2436"/>
  <text x="162" y="152" font-family="Segoe UI,Arial" font-size="20" font-weight="800" fill="url(#gold7)">৳12.4K</text>
  <text x="162" y="172" font-family="Segoe UI,Arial" font-size="11" fill="#94A3B8">Today's Sales</text>
  <rect x="282" y="126" width="120" height="56" rx="10" fill="#1B2436"/>
  <text x="296" y="152" font-family="Segoe UI,Arial" font-size="20" font-weight="800" fill="#38BDF8">348</text>
  <text x="296" y="172" font-family="Segoe UI,Arial" font-size="11" fill="#94A3B8">Orders</text>
  <!-- chart -->
  <path d="M160 260 h220" stroke="#334155" stroke-width="3"/>
  <rect x="166" y="226" width="26" height="34" rx="4" fill="url(#bar7)" opacity="0.6"/>
  <rect x="206" y="212" width="26" height="48" rx="4" fill="url(#bar7)" opacity="0.75"/>
  <rect x="246" y="200" width="26" height="60" rx="4" fill="url(#bar7)"/>
  <rect x="286" y="216" width="26" height="44" rx="4" fill="url(#bar7)" opacity="0.7"/>
  <rect x="326" y="190" width="26" height="70" rx="4" fill="url(#bar7)"/>
  <path d="M168 224 q60 -34 120 -60 q34 -22 72 -34" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <!-- flag accent -->
  <rect x="424" y="196" width="98" height="64" rx="10" fill="#065F46"/>
  <circle cx="473" cy="228" r="20" fill="#DC2626"/>
  <text x="130" y="356" font-family="Segoe UI,Arial" font-size="26" font-weight="800" fill="url(#gold7)">Bangladesh E-Commerce</text>
  <text x="130" y="380" font-family="Segoe UI,Arial" font-size="14" fill="#94A3B8">Powering sellers nationwide</text>
</svg>
