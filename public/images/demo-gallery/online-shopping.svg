<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Online shopping">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223B"/><stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4A3"/><stop offset="0.5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B77912"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <circle cx="520" cy="70" r="90" fill="#D4AF37" opacity="0.08"/>
  <circle cx="80" cy="340" r="70" fill="#D4AF37" opacity="0.06"/>
  <!-- phone -->
  <rect x="70" y="80" width="140" height="230" rx="20" fill="#1F2937" stroke="url(#gold1)" stroke-width="3"/>
  <rect x="84" y="100" width="112" height="190" rx="10" fill="#0B1220"/>
  <rect x="112" y="86" width="56" height="8" rx="4" fill="#374151"/>
  <rect x="98" y="150" width="84" height="70" rx="8" fill="#D4AF37" opacity="0.85"/>
  <path d="M118 195 l16-20 12 14 10-10 12 16z" fill="#0B1220" opacity="0.6"/>
  <rect x="98" y="234" width="40" height="8" rx="4" fill="#D4AF37"/>
  <rect x="98" y="250" width="70" height="8" rx="4" fill="#374151"/>
  <rect x="98" y="266" width="60" height="14" rx="7" fill="url(#gold1)"/>
  <!-- cart -->
  <path d="M300 130 h60 l18 90 h120 l24-90" fill="none" stroke="url(#gold1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="352" cy="242" r="14" fill="url(#gold1)"/>
  <circle cx="482" cy="242" r="14" fill="url(#gold1)"/>
  <!-- floating product boxes -->
  <rect x="300" y="60" width="60" height="60" rx="10" fill="#D4AF37" opacity="0.9" transform="rotate(-12 330 90)"/>
  <rect x="420" y="40" width="48" height="48" rx="8" fill="#38BDF8" opacity="0.7" transform="rotate(14 444 64)"/>
  <rect x="250" y="300" width="50" height="50" rx="8" fill="#A78BFA" opacity="0.6"/>
  <text x="300" y="330" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="url(#gold1)">Online Shopping</text>
  <text x="300" y="358" font-family="Segoe UI,Arial" font-size="16" fill="#CBD5E1">Shop anytime, anywhere</text>
</svg>
