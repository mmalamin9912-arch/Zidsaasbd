    <rect x="322" y="224" width="34" height="34" rx="4" fill="none" stroke="#D4AF37" stroke-width="8"/>
    <rect x="330" y="110" width="18" height="18" fill="#D4AF37"/>
    <rect x="452" y="110" width="18" height="18" fill="#D4AF37"/>
    <rect x="330" y="232" width="18" height="18" fill="#D4AF37"/>
    <rect x="376" y="130" width="16" height="16" fill="#38BDF8"/>
    <rect x="404" y="150" width="16" height="16" fill="#D4AF37" opacity="0.6"/>
    <rect x="404" y="196" width="16" height="16" fill="#38BDF8" opacity="0.7"/>
    <rect x="376" y="224" width="16" height="16" fill="#D4AF37" opacity="0.6"/>
    <rect x="434" y="160" width="14" height="14" fill="#4ADE80"/>
    <rect x="376" y="182" width="14" height="14" fill="#D4AF37"/>
    <rect x="404" y="250" width="14" height="14" fill="#38BDF8" opacity="0.6"/>
    <rect x="460" y="240" width="14" height="14" fill="#D4AF37" opacity="0.6"/>
    <rect x="350" y="196" width="14" height="14" fill="#4ADE80"/>
    <rect x="434" y="252" width="14" height="14" fill="#D4AF37" opacity="0.5"/>
    <rect x="350" y="252" width="14" height="14" fill="#38BDF8" opacity="0.6"/>
