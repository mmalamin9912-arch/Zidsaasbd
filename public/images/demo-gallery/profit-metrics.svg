<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Profit metrics">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223B"/><stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4A3"/><stop offset="0.5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B77912"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#B77912"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)"/>
  <!-- chart base -->
  <path d="M120 300 h360" stroke="#334155" stroke-width="4"/>
  <path d="M120 300 v-180" stroke="#334155" stroke-width="4"/>
  <!-- bars -->
  <rect x="150" y="230" width="42" height="70" rx="6" fill="url(#bar5)" opacity="0.55"/>
  <rect x="212" y="200" width="42" height="100" rx="6" fill="url(#bar5)" opacity="0.7"/>
  <rect x="274" y="170" width="42" height="130" rx="6" fill="url(#bar5)" opacity="0.85"/>
  <rect x="336" y="140" width="42" height="160" rx="6" fill="url(#bar5)"/>
  <!-- trend arrow -->
  <path d="M160 235 q60 -40 120 -70 q40 -30 90 -55" fill="none" stroke="#4ADE80" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M360 105 l26 6 -8 26z" fill="#4ADE80"/>
  <!-- coins -->
  <g>
    <ellipse cx="470" cy="200" rx="46" ry="16" fill="url(#gold5)"/>
    <path d="M424 200 q6 -34 46 -34 q40 0 46 34" fill="url(#gold5)"/>
    <text x="458" y="205" font-family="Segoe UI,Arial" font-size="20" font-weight="800" fill="#070C18">৳</text>
  </g>
  <text x="120" y="340" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="url(#gold5)">Profit &amp; Growth</text>
</svg>
