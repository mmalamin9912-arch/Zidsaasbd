<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Sports gear">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223B"/><stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4A3"/><stop offset="0.5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B77912"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>
  <!-- basketball -->
  <circle cx="160" cy="150" r="70" fill="#F97316" opacity="0.9"/>
  <g stroke="#7C2D12" stroke-width="4" fill="none">
    <path d="M90 150 h140"/><path d="M160 80 v140"/>
    <path d="M105 105 q55 45 110 0"/><path d="M105 195 q55 -45 110 0"/>
  </g>
  <!-- dumbbell -->
  <rect x="300" y="140" width="120" height="20" rx="6" fill="#94A3B8"/>
  <rect x="285" y="115" width="24" height="70" rx="6" fill="url(#gold4)"/>
  <rect x="410" y="115" width="24" height="70" rx="6" fill="url(#gold4)"/>
  <!-- shoe -->
  <path d="M330 260 q10 -40 40 -50 h60 q40 4 55 30 q10 20 -10 24 l-140 8 q-20 0 -5 -12z" fill="#38BDF8" opacity="0.85"/>
  <path d="M300 262 h250 v14 q0 6 -6 6 h-238 q-6 0 -6 -6z" fill="url(#gold4)"/>
  <!-- speed lines -->
  <g stroke="#D4AF37" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <path d="M60 250 h40"/><path d="M60 275 h60"/><path d="M60 300 h30"/>
  </g>
  <text x="120" y="350" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="url(#gold4)">Sports &amp; Fitness</text>
</svg>
