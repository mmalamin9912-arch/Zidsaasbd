<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Lifestyle products">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223B"/><stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4A3"/><stop offset="0.5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B77912"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>
  <circle cx="120" cy="120" r="80" fill="#D4AF37" opacity="0.07"/>
  <!-- table -->
  <rect x="90" y="270" width="420" height="12" rx="6" fill="#374151"/>
  <!-- vase -->
  <path d="M170 270 q-20 -60 15 -90 h30 q35 30 15 90z" fill="url(#gold3)"/>
  <!-- plant pot -->
  <rect x="255" y="215" width="46" height="55" rx="6" fill="#38BDF8" opacity="0.8"/>
  <path d="M278 215 q-40 -10 -30 -50 q28 6 30 50z" fill="#4ADE80" opacity="0.8"/>
  <path d="M278 215 q40 -20 34 -55 q-30 10 -34 55z" fill="#22C55E" opacity="0.8"/>
  <!-- candle stack -->
  <rect x="340" y="200" width="34" height="70" rx="6" fill="#F472B6" opacity="0.85"/>
  <rect x="348" y="188" width="18" height="14" rx="3" fill="url(#gold3)"/>
  <!-- lamp -->
  <rect x="410" y="215" width="60" height="12" rx="4" fill="#D4AF37"/>
  <rect x="436" y="227" width="8" height="43" fill="#94A3B8"/>
  <rect x="414" y="270" width="52" height="8" rx="4" fill="#94A3B8"/>
  <!-- books -->
  <rect x="150" y="248" width="12" height="22" fill="#A78BFA"/>
  <rect x="164" y="242" width="10" height="28" fill="#38BDF8"/>
  <text x="90" y="330" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="url(#gold3)">Lifestyle &amp; Home</text>
</svg>
